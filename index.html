<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📊 RS 统计管理系统 | 排行榜自动生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, 'Noto Sans SC', sans-serif; }
        body {
            background: linear-gradient(145deg, #e6f7f9 0%, #b2ebf2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 188, 212, 0.3);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background: linear-gradient(105deg, #00acc1 0%, #00838f 100%);
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0,172,193,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 20px -8px #00acc1; }
        .btn-copy {
            background: linear-gradient(135deg, #ff8a65 0%, #ff5722 100%);
            transition: 0.2s;
        }
        .btn-copy.copied { background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%); }
        .stat-card {
            background: rgba(255,255,255,0.9);
            border-radius: 2rem;
            border-left: 6px solid #00bcd4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .preview-box {
            background: #1e2a32;
            border-radius: 1.5rem;
            font-family: 'SF Mono', 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .leaderboard-header {
            background: linear-gradient(90deg, #00acc1, #0097a7);
        }
        .smurf-header {
            background: linear-gradient(90deg, #fb8c00, #ef6c00);
        }
        .input-field:focus { border-color: #00bcd4; box-shadow: 0 0 0 3px rgba(0,188,212,0.2); transform: translateY(-1px); }
        .delete-btn:hover { background: #ef5350; color: white; transform: scale(1.05); }
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: 999px; font-weight: 800; }
        .rank-1 { background: #ffd966; color: #b45309; }
        .rank-2 { background: #e0e0e0; color: #424242; }
        .rank-3 { background: #e0bb87; color: #7b3f00; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .row-enter { animation: fadeSlide 0.2s ease-out; }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e0f2f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #00acc1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-6 relative">

<div class="max-w-7xl mx-auto relative z-10">
    <!-- 标题区 -->
    <div class="text-center mb-8">
        <div class="inline-block glass-panel rounded-3xl px-8 py-5 shadow-xl">
            <h1 class="text-5xl md:text-6xl font-extrabold bg-gradient-to-r from-cyan-700 via-teal-600 to-cyan-700 bg-clip-text text-transparent">📊 RS 统计管理系统</h1>
            <div class="flex justify-center gap-4 mt-2 text-cyan-700 font-semibold">
                <span>🏆 自动合并重复账号</span>
                <span>🔒 隐私隐藏(留后5位)</span>
                <span>🌏 三语排行榜</span>
            </div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
        <div class="stat-card p-5 flex justify-between items-center"><div><div class="text-cyan-700 text-sm font-bold">R1 总量</div><div class="text-4xl font-black text-cyan-800" id="totalR1">0</div></div><span class="text-4xl">🎯</span></div>
        <div class="stat-card p-5 flex justify-between items-center"><div><div class="text-purple-700 text-sm font-bold">R2 总量</div><div class="text-4xl font-black text-purple-800" id="totalR2">0</div></div><span class="text-4xl">💜</span></div>
        <div class="stat-card p-5 flex justify-between items-center"><div><div class="text-amber-700 text-sm font-bold">R3 总量</div><div class="text-4xl font-black text-amber-800" id="totalR3">0</div></div><span class="text-4xl">⚜️</span></div>
    </div>

    <!-- 操作栏 -->
    <div class="glass-panel rounded-2xl p-5 mb-8 flex flex-wrap justify-between items-center gap-4">
        <div class="flex gap-3 flex-wrap">
            <button onclick="openAddModal()" class="btn-primary px-6 py-3 rounded-xl font-bold text-white flex items-center gap-2 shadow-md">➕ 添加账户</button>
            <button onclick="downloadData()" class="bg-green-600 hover:bg-green-700 px-5 py-3 rounded-xl font-bold text-white flex items-center gap-2 shadow">💾 导出CSV</button>
            <button onclick="clearAll()" class="bg-red-100 hover:bg-red-200 text-red-700 px-5 py-3 rounded-xl font-bold">🗑️ 清空数据</button>
        </div>
        <div class="flex items-center gap-2 bg-white/60 px-4 py-2 rounded-full"><span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span><span class="text-sm text-cyan-800" id="saveStatus">✅ 自动保存</span></div>
    </div>

    <!-- 排行榜生成区（新样式） -->
    <div class="glass-panel rounded-2xl p-6 mb-9 border-t-4 border-cyan-400">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
            <div><h2 class="text-2xl font-black text-gray-800 flex items-center gap-2">📋 排行榜文案 · 三语生成</h2><p class="text-xs text-gray-500 mt-1">账户隐私显示：***** + 后五位 (例: *****12345)</p></div>
            <div class="flex flex-wrap gap-2">
                <button onclick="copyStats('ms')" class="btn-copy px-4 py-2 rounded-xl font-bold text-white flex items-center gap-1"><span>🇲🇾</span> BM</button>
                <button onclick="copyStats('zh')" class="btn-copy px-4 py-2 rounded-xl font-bold text-white flex items-center gap-1"><span>🇨🇳</span> 中文</button>
                <button onclick="copyStats('en')" class="btn-copy px-4 py-2 rounded-xl font-bold text-white flex items-center gap-1"><span>🇬🇧</span> EN</button>
                <button onclick="copyStats('all')" class="bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-2 rounded-xl font-bold text-white shadow">🌐 三语全复制</button>
            </div>
        </div>
        <div class="preview-box p-5 text-gray-100 text-sm md:text-base overflow-x-auto shadow-inner">
            <pre id="previewText" class="whitespace-pre-wrap font-mono">✨ 点击上方按钮生成最新排行榜 ✨</pre>
        </div>
    </div>

    <!-- 双栏管理表 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- 正常账户 -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
            <div class="leaderboard-header px-5 py-4 flex justify-between items-center"><span class="font-bold text-white text-lg flex gap-2">👥 正常账户排行榜</span><span class="bg-white/30 px-3 py-1 rounded-full text-sm" id="normalCount">0</span></div>
            <div class="overflow-x-auto max-h-[420px] overflow-y-auto"><table class="w-full"><thead class="sticky top-0 bg-cyan-50"><tr class="border-b border-cyan-200"><th class="p-3 text-left w-12">#</th><th class="p-3 text-left">账户名</th><th class="p-3 text-center">R1</th><th class="p-3 text-center">R2</th><th class="p-3 text-center">R3</th><th class="p-3 text-right">总计</th><th class="p-3 text-center">操作</th></tr></thead><tbody id="normalTableBody"></tbody></table><div id="normalEmpty" class="py-12 text-center text-gray-400 hidden">📭 暂无正常账户</div></div>
        </div>
        <!-- 小号 -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
            <div class="smurf-header px-5 py-4 flex justify-between items-center"><span class="font-bold text-white text-lg flex gap-2">🎭 小号排行榜</span><span class="bg-white/30 px-3 py-1 rounded-full text-sm" id="smurfCount">0</span></div>
            <div class="overflow-x-auto max-h-[420px] overflow-y-auto"><table class="w-full"><thead class="sticky top-0 bg-orange-50"><tr class="border-b border-orange-200"><th class="p-3 text-left w-12">#</th><th class="p-3 text-left">账户名</th><th class="p-3 text-center">R1</th><th class="p-3 text-center">R2</th><th class="p-3 text-center">R3</th><th class="p-3 text-right">总计</th><th class="p-3 text-center">操作</th></tr></thead><tbody id="smurfTableBody"></tbody></table><div id="smurfEmpty" class="py-12 text-center text-gray-400 hidden">🎭 暂无小号数据</div></div>
        </div>
    </div>
    <div class="text-center mt-8 text-cyan-700 text-xs font-medium">✨ 数据自动存储本地 | 重复账号添加时自动累加 R1/R2/R3 ✨</div>
</div>

<!-- 添加账户模态框 -->
<div id="addModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 transition-all">
    <div class="glass-panel rounded-3xl p-7 w-full max-w-md mx-4 shadow-2xl">
        <div class="flex gap-3 items-center mb-5"><span class="text-3xl">➕</span><h3 class="text-2xl font-black text-cyan-800">添加 / 累加账户</h3></div>
        <div class="space-y-5">
            <div><label class="font-bold text-cyan-700">账户名称 (完整)</label><input type="text" id="newAccountName" placeholder="例: RS_8888" class="input-field w-full p-3 rounded-xl border-2 mt-1"></div>
            <div><label class="font-bold text-gray-700 block mb-2">账户类型 (仅内部区分)</label><div class="flex gap-4"><label class="flex items-center gap-2 bg-blue-50 p-3 rounded-xl cursor-pointer"><input type="radio" name="typeRadio" value="normal" checked> <span>👤 正常账户</span></label><label class="flex items-center gap-2 bg-orange-50 p-3 rounded-xl cursor-pointer"><input type="radio" name="typeRadio" value="smurf"> <span>🎭 小号</span></label></div></div>
            <div class="grid grid-cols-3 gap-3"><div><label class="text-cyan-600 text-sm font-bold">R1</label><input type="number" id="newR1" class="input-field w-full p-3 rounded-xl text-center" value="0"></div><div><label class="text-purple-600 text-sm font-bold">R2</label><input type="number" id="newR2" class="input-field w-full p-3 rounded-xl text-center" value="0"></div><div><label class="text-amber-600 text-sm font-bold">R3</label><input type="number" id="newR3" class="input-field w-full p-3 rounded-xl text-center" value="0"></div></div>
        </div>
        <div class="flex gap-3 mt-7"><button onclick="closeAddModal()" class="flex-1 py-3 bg-gray-200 rounded-xl font-bold">取消</button><button onclick="confirmAddWithMerge()" class="flex-1 btn-primary py-3 rounded-xl font-bold text-white">✅ 确认添加/累加</button></div>
    </div>
</div>

<script>
    // ---------- 数据核心 ----------
    let accounts = [];      // 对象结构: { id, account, type, r1, r2, r3 }
    const STORAGE_KEY = 'rs_management_v7_merge';

    // 加载数据
    function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) {
            try {
                accounts = JSON.parse(raw);
            } catch(e) { accounts = []; }
        }
        if(!accounts.length) accounts = [];
    }
    function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
        const statusDiv = document.getElementById('saveStatus');
        if(statusDiv) { statusDiv.innerHTML = '💾 已保存'; setTimeout(() => { if(statusDiv) statusDiv.innerHTML = '✅ 自动保存'; }, 1200); }
    }

    // ---------- 合并逻辑: 根据账户名+类型合并累加 (同类型下相同账户名自动累加R1/R2/R3) ----------
    // 返回值: 是否执行了合并操作 (但不再弹提示框)
    function addOrMergeAccount(accountName, type, r1Val, r2Val, r3Val) {
        if(!accountName || accountName.trim() === "") return false;
        const trimmedName = accountName.trim();
        const existing = accounts.find(item => item.account === trimmedName && item.type === type);
        if(existing) {
            // 累加 (静默合并, 不弹窗)
            existing.r1 = (parseInt(existing.r1)||0) + (parseInt(r1Val)||0);
            existing.r2 = (parseInt(existing.r2)||0) + (parseInt(r2Val)||0);
            existing.r3 = (parseInt(existing.r3)||0) + (parseInt(r3Val)||0);
            persist();
            return true; // 合并模式
        } else {
            // 新增
            const newId = Date.now() + Math.floor(Math.random() * 10000);
            accounts.push({
                id: newId,
                account: trimmedName,
                type: type,
                r1: parseInt(r1Val)||0,
                r2: parseInt(r2Val)||0,
                r3: parseInt(r3Val)||0
            });
            persist();
            return false; // 新增模式
        }
    }

    // 获取排序后数据 (按总计)
    function getSortedData() {
        return [...accounts].map(acc => ({
            ...acc,
            total: (parseInt(acc.r1)||0)+(parseInt(acc.r2)||0)+(parseInt(acc.r3)||0)
        })).sort((a,b) => b.total - a.total);
    }

    // 隐私遮蔽：仅显示最后5位，其余全部变成 * (保留后五位字符，前面全部星号)
    // 例如 "RS_888812345" => "*****12345" (如果长度<=5则直接显示原字符)
    function maskAccount(name) {
        if(!name) return "*****";
        const len = name.length;
        if(len <= 5) return name;  // 很短就直接显示原名
        // 保留后五位，前面全部替换为 *
        const lastFive = name.substring(len - 5);
        const stars = '*'.repeat(Math.min(len - 5, 8)); // 至少保证前面都是*，长度不限
        return stars + lastFive;
    }

    // 渲染两个表格
    function renderTables() {
        const sorted = getSortedData();
        const normals = sorted.filter(i => i.type === 'normal');
        const smurfs = sorted.filter(i => i.type === 'smurf');
        document.getElementById('normalCount').innerText = normals.length;
        document.getElementById('smurfCount').innerText = smurfs.length;

        // 渲染正常表
        const normalTbody = document.getElementById('normalTableBody');
        const normalEmpty = document.getElementById('normalEmpty');
        if(normals.length === 0) {
            normalTbody.innerHTML = '';
            normalEmpty.classList.remove('hidden');
        } else {
            normalEmpty.classList.add('hidden');
            normalTbody.innerHTML = normals.map((item, idx) => {
                const rank = idx+1;
                let rankHtml = `<span class="rank-badge ${rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'bg-gray-100 text-gray-700'}">${rank<=3 ? (rank===1?'🥇':rank===2?'🥈':'🥉') : rank}</span>`;
                return `<tr class="row-enter border-b border-cyan-100 hover:bg-cyan-50/60">
                    <td class="p-3">${rankHtml}</td>
                    <td class="p-3 font-semibold text-gray-800 cursor-pointer hover:text-cyan-600" ondblclick="editAccountName(${item.id}, this)">${item.account}</td>
                    <td class="p-3 text-center"><input type="number" value="${item.r1}" onchange="updateValue(${item.id},'r1',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-center"><input type="number" value="${item.r2}" onchange="updateValue(${item.id},'r2',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-center"><input type="number" value="${item.r3}" onchange="updateValue(${item.id},'r3',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-right font-black text-cyan-700">${item.total}</td>
                    <td class="p-3 text-center"><button onclick="deleteRow(${item.id})" class="delete-btn p-1.5 rounded-lg">🗑️</button></td>
                </tr>`;
            }).join('');
        }

        // 渲染小号表
        const smurfTbody = document.getElementById('smurfTableBody');
        const smurfEmpty = document.getElementById('smurfEmpty');
        if(smurfs.length === 0) {
            smurfTbody.innerHTML = '';
            smurfEmpty.classList.remove('hidden');
        } else {
            smurfEmpty.classList.add('hidden');
            smurfTbody.innerHTML = smurfs.map((item, idx) => {
                const rank = idx+1;
                let rankHtml = `<span class="rank-badge ${rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'bg-gray-100'}">${rank<=3 ? (rank===1?'🥇':rank===2?'🥈':'🥉') : rank}</span>`;
                return `<tr class="row-enter border-b border-orange-100 hover:bg-orange-50/50">
                    <td class="p-3">${rankHtml}</td>
                    <td class="p-3 font-semibold text-gray-800 cursor-pointer hover:text-orange-600" ondblclick="editAccountName(${item.id}, this)">${item.account}</td>
                    <td class="p-3 text-center"><input type="number" value="${item.r1}" onchange="updateValue(${item.id},'r1',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-center"><input type="number" value="${item.r2}" onchange="updateValue(${item.id},'r2',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-center"><input type="number" value="${item.r3}" onchange="updateValue(${item.id},'r3',this.value)" class="w-20 text-center border rounded-lg p-1 bg-white/80"></td>
                    <td class="p-3 text-right font-black text-orange-700">${item.total}</td>
                    <td class="p-3 text-center"><button onclick="deleteRow(${item.id})" class="delete-btn p-1.5 rounded-lg">🗑️</button></td>
                </tr>`;
            }).join('');
        }
        updateTotalStats();
        updatePreviewText();  // 实时刷新预览
    }

    function updateTotalStats() {
        const totalR1 = accounts.reduce((s,i)=> s+(parseInt(i.r1)||0),0);
        const totalR2 = accounts.reduce((s,i)=> s+(parseInt(i.r2)||0),0);
        const totalR3 = accounts.reduce((s,i)=> s+(parseInt(i.r3)||0),0);
        document.getElementById('totalR1').innerText = totalR1.toLocaleString();
        document.getElementById('totalR2').innerText = totalR2.toLocaleString();
        document.getElementById('totalR3').innerText = totalR3.toLocaleString();
    }

    function updateValue(id, field, val) {
        const item = accounts.find(a => a.id === id);
        if(item) {
            item[field] = parseInt(val) || 0;
            persist();
            renderTables();
        }
    }
    function deleteRow(id) {
        if(confirm('⚠️ 确定删除此账户吗？')) {
            accounts = accounts.filter(a => a.id !== id);
            persist();
            renderTables();
        }
    }
    function editAccountName(id, element) {
        const item = accounts.find(a => a.id === id);
        if(!item) return;
        const oldName = item.account;
        const input = document.createElement('input');
        input.value = oldName;
        input.className = "border-2 border-cyan-300 rounded-lg p-1 w-full font-bold";
        element.innerText = '';
        element.appendChild(input);
        input.focus();
        const saveEdit = () => {
            let newVal = input.value.trim();
            if(newVal && newVal !== oldName) {
                // 检查同类型下是否重复 (避免重名冲突)
                const conflict = accounts.find(a => a.account === newVal && a.type === item.type && a.id !== id);
                if(conflict) {
                    alert("❌ 同类型下已有相同账户名！不允许重名，请修改或合并。");
                    element.innerText = oldName;
                    return;
                }
                item.account = newVal;
                persist();
                renderTables();
            } else if(!newVal) {
                element.innerText = oldName;
            } else {
                element.innerText = oldName;
            }
        };
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keydown', (e) => { if(e.key === 'Enter') { saveEdit(); } });
    }
    function clearAll() {
        if(accounts.length && confirm('⚠️ 彻底清空所有数据？不可恢复。')) { accounts = []; persist(); renderTables(); }
    }

    // ---------- 排行榜文案新格式 (马来语标题等) 且采用新的隐私遮蔽(后五位) ----------
    function generateLeaderboardText(lang) {
        const sorted = getSortedData();
        if(sorted.length === 0) return lang === 'zh' ? "暂无数据，添加账户后生成排行榜" : (lang==='ms'?"Tiada data buat masa ini":"No data available");
        
        let header = "";
        let footer = "";
        if(lang === 'ms') {
            header = "📊 Laporan Prestasi Terkini\n━━━━━━━━━━━━━━━━━━━━━━\n";
            footer = "\n━━━━━━━━━━━━━━━━━━━━━━\nSerahkan usaha kepada masa, serahkan hasil kepada ketekunan...✨\n\n💭 Anda sekarang, sedang berusaha untuk matlamat yang mana?";
        } else if(lang === 'zh') {
            header = "📊 最新绩效排行榜\n━━━━━━━━━━━━━━━━━━━━━━\n";
            footer = "\n━━━━━━━━━━━━━━━━━━━━━━\n把努力交给时间，把结果交给坚持...✨\n\n💭 现在的你，正在为哪个目标而奋斗？";
        } else { // english
            header = "📊 Latest Performance Ranking\n━━━━━━━━━━━━━━━━━━━━━━\n";
            footer = "\n━━━━━━━━━━━━━━━━━━━━━━\nLeave effort to time, leave results to persistence...✨\n\n💭 Which goal are you striving for right now?";
        }
        
        let body = "";
        sorted.forEach((item, idx) => {
            // 使用新的隐私规则：显示后五位，其余星号
            const masked = maskAccount(item.account);
            const r1v = parseInt(item.r1)||0;
            const r2v = parseInt(item.r2)||0;
            const r3v = parseInt(item.r3)||0;
            const total = r1v+r2v+r3v;
            if(lang === 'ms') {
                body += `${idx+1}. ${masked}  R1: ${r1v} | R2: ${r2v} | R3: ${r3v}  Jumlah: ${total}\n`;
            } else if(lang === 'zh') {
                body += `${idx+1}. ${masked}  R1: ${r1v} | R2: ${r2v} | R3: ${r3v}  总计: ${total}\n`;
            } else {
                body += `${idx+1}. ${masked}  R1: ${r1v} | R2: ${r2v} | R3: ${r3v}  Total: ${total}\n`;
            }
        });
        return header + body + footer;
    }

    // 三语全文本
    function getAllLanguagesText() {
        return generateLeaderboardText('ms') + "\n\n────────────────────\n\n" + generateLeaderboardText('zh') + "\n\n────────────────────\n\n" + generateLeaderboardText('en');
    }

    function updatePreviewText() {
        const sorted = getSortedData();
        if(sorted.length === 0) {
            document.getElementById('previewText').innerText = "✨ 暂无数据，点击「添加账户」开始统计 ✨";
            return;
        }
        // 默认预览中文
        document.getElementById('previewText').innerText = generateLeaderboardText('zh');
    }

    // 复制功能 + 按钮特效 (无alert干扰)
    async function copyStats(format) {
        let text = "";
        let btnElement = null;
        if(format === 'all') {
            text = getAllLanguagesText();
            btnElement = document.querySelector('button[onclick*="copyStats(\'all\')"]');
        } else {
            text = generateLeaderboardText(format);
            if(format === 'ms') btnElement = document.querySelector('button[onclick*="copyStats(\'ms\')"]');
            else if(format === 'zh') btnElement = document.querySelector('button[onclick*="copyStats(\'zh\')"]');
            else if(format === 'en') btnElement = document.querySelector('button[onclick*="copyStats(\'en\')"]');
        }
        try {
            await navigator.clipboard.writeText(text);
            if(btnElement) {
                const originalHTML = btnElement.innerHTML;
                btnElement.classList.add('copied');
                if(format === 'all') btnElement.innerHTML = '🌐 已复制三语！';
                else if(format === 'ms') btnElement.innerHTML = '✅ BM已复制';
                else if(format === 'zh') btnElement.innerHTML = '✅ 中文已复制';
                else btnElement.innerHTML = '✅ EN Copied!';
                setTimeout(() => {
                    btnElement.classList.remove('copied');
                    btnElement.innerHTML = originalHTML;
                }, 1600);
            } else {
                // 后备
                alert("文案已复制到剪贴板");
            }
        } catch(err) {
            console.warn("复制失败", err);
        }
    }

    // 导出CSV (保留完整账户名)
    function downloadData() {
        if(!accounts.length) { alert('无数据可导出'); return; }
        let csv = "\uFEFF序号,完整账户名,账户类型,R1,R2,R3,合计\n";
        const sorted = getSortedData();
        sorted.forEach((it,idx) => {
            csv += `${idx+1},${it.account},${it.type==='normal'?'正常账户':'小号'},${it.r1},${it.r2},${it.r3},${it.total}\n`;
        });
        const totalR1 = accounts.reduce((s,i)=>s+(parseInt(i.r1)||0),0);
        const totalR2 = accounts.reduce((s,i)=>s+(parseInt(i.r2)||0),0);
        const totalR3 = accounts.reduce((s,i)=>s+(parseInt(i.r3)||0),0);
        csv += `\n总计,,,${totalR1},${totalR2},${totalR3},${totalR1+totalR2+totalR3}\n`;
        const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download",`RS_export_${new Date().toISOString().slice(0,19)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // 模态框合并添加逻辑 (彻底去掉所有提示弹窗)
    function confirmAddWithMerge() {
        const accountName = document.getElementById('newAccountName').value.trim();
        if(!accountName) { 
            // 静默失败，但为了用户体验给一个小提醒（非alert? 但交互需要提示，轻提醒保留最基本必填）
            alert("请输入账户名称"); 
            return; 
        }
        const type = document.querySelector('input[name="typeRadio"]:checked').value;
        let r1 = parseInt(document.getElementById('newR1').value) || 0;
        let r2 = parseInt(document.getElementById('newR2').value) || 0;
        let r3 = parseInt(document.getElementById('newR3').value) || 0;
        if(r1<0) r1=0; if(r2<0) r2=0; if(r3<0) r3=0;
        // 调用合并/新增函数，不做任何弹窗
        addOrMergeAccount(accountName, type, r1, r2, r3);
        // 重新渲染
        renderTables();
        closeAddModal();
        // 清空输入框
        document.getElementById('newAccountName').value = '';
        document.getElementById('newR1').value = '0';
        document.getElementById('newR2').value = '0';
        document.getElementById('newR3').value = '0';
    }

    function openAddModal() {
        const modal = document.getElementById('addModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.getElementById('newAccountName').focus();
        document.getElementById('newR1').value = '0';
        document.getElementById('newR2').value = '0';
        document.getElementById('newR3').value = '0';
    }
    function closeAddModal() {
        const modal = document.getElementById('addModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
    // 全局点击外部关闭
    document.getElementById('addModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('addModal')) closeAddModal(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeAddModal(); });

    // 初始化
    loadData();
    renderTables();
</script>
