<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧧 RS 统计表 - 编码修复版</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --bg-color: #fce4ec;
            --r1-color: #e53935;
            --r2-color: #7b1fa2;
            --r3-color: #ffa000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; }
        body { background-color: var(--bg-color); padding: 30px 15px; min-height: 100vh; }
        
        .layout-wrapper { max-width: 850px; margin: 0 auto; position: relative; }
        .container { width: 100%; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* 侧边随动按钮逻辑 */
        .action-sidebar {
            position: absolute;
            left: 100%;
            top: 0;
            height: 100%;
            margin-left: 15px;
        }
        .sticky-box {
            position: sticky;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .float-btn {
            width: 75px; height: 75px; border-radius: 18px; border: none; cursor: pointer;
            font-size: 12px; font-weight: bold; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            color: white; background: #e53935; transition: transform 0.1s;
        }
        .float-btn:active { transform: scale(0.92); }
        .float-btn i { font-size: 26px; margin-bottom: 4px; font-style: normal; }
        .btn-report-float { background: #43a047; }

        h1 { text-align: center; color: var(--primary-red); margin-bottom: 30px; font-size: 32px; letter-spacing: 2px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { text-align: center; padding: 20px; border-radius: 15px; color: white; }
        .stat-card h4 { font-size: 14px; margin-bottom: 5px; opacity: 0.9; }
        .stat-card span { font-size: 26px; font-weight: bold; }
        .r1-bg { background: var(--r1-color); }
        .r2-bg { background: var(--r2-color); }
        .r3-bg { background: var(--r3-color); }

        .top-tools { display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end; }
        .btn-tool { padding: 8px 15px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; color: #666; }

        table { width: 100%; border-collapse: collapse; font-size: 16px; }
        th, td { border-bottom: 1px solid #eee; padding: 18px 12px; text-align: left; }
        th { background: #fcfcfc; color: #555; }
        .acc-type { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #f0f0f0; color: #888; margin-left: 8px; font-weight: normal; }
        .del-btn { color: #d32f2f; cursor: pointer; font-size: 14px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 450px; margin: 80px auto; padding: 30px; border-radius: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 16px; }
        
        #reportArea { white-space: pre-wrap; background: #222; color: #00ff00; padding: 25px; border-radius: 12px; font-family: monospace; display: none; margin-top: 30px; font-size: 14px; }
        #fileInput { display: none; }

        @media (max-width: 1050px) {
            .action-sidebar { position: fixed; left: auto; right: 20px; top: auto; bottom: 30px; height: auto; margin-left: 0; }
            .sticky-box { flex-direction: row; top: auto; }
            .float-btn { width: 65px; height: 65px; border-radius: 50%; }
        }
    </style>
</head>
<body>

<div class="layout-wrapper">
    <div class="action-sidebar">
        <div class="sticky-box">
            <button class="float-btn" onclick="showModal()"><i>+</i><span>录入数据</span></button>
            <button class="float-btn btn-report-float" onclick="generateReport()"><i>📊</i><span>复制战报</span></button>
        </div>
    </div>

    <div class="container">
        <h1>🧧 RS 统计表 🧧</h1>
        <div class="stats-grid">
            <div class="stat-card r1-bg"><h4>R1 红红火火</h4><span id="totalR1">0</span></div>
            <div class="stat-card r2-bg"><h4>R2 紫气东来</h4><span id="totalR2">0</span></div>
            <div class="stat-card r3-bg"><h4>R3 黄金万两</h4><span id="totalR3">0</span></div>
        </div>
        <div class="top-tools">
            <button class="btn-tool" onclick="exportCSV()">💾 导出备份</button>
            <button class="btn-tool" onclick="document.getElementById('fileInput').click()">📂 导入 CSV</button>
            <button class="btn-tool" style="color:#d32f2f" onclick="clearAll()">🗑️ 清空</button>
        </div>
        <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
        <table>
            <thead><tr><th>账户名称</th><th>R1</th><th>R2</th><th>R3</th><th>操作</th></tr></thead>
            <tbody id="accountTable"></tbody>
        </table>
        <div id="reportArea"></div>
    </div>
</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>数据录入/更新</h3>
        <div class="input-group"><label>账户名</label><input type="text" id="accName" placeholder="请输入完整账户名"></div>
        <div class="input-group">
            <label>账户类型</label>
            <select id="accType"><option value="小号">小号</option><option value="正常">正常</option></select>
        </div>
        <div class="input-group"><label>R1</label><input type="number" id="r1Val" value="0"></div>
        <div class="input-group"><label>R2</label><input type="number" id="r2Val" value="0"></div>
        <div class="input-group"><label>R3</label><input type="number" id="r3Val" value="0"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closeModal()" style="background:#eee; flex:1; padding:12px; border-radius:8px; border:none;">取消</button>
            <button onclick="addOrUpdateAccount()" style="background:var(--primary-red); color:white; flex:2; padding:12px; border-radius:8px; border:none; font-weight:bold;">提交保存</button>
        </div>
    </div>
</div>

<script>
    let accounts = JSON.parse(localStorage.getItem('rs_final_v7')) || [];

    function showModal() { document.getElementById('addModal').style.display = 'block'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function maskName(name) {
        const str = String(name);
        return "******" + (str.length > 5 ? str.slice(-5) : str.padStart(5, '0'));
    }

    function addOrUpdateAccount() {
        const name = document.getElementById('accName').value.trim();
        const type = document.getElementById('accType').value;
        const r1 = parseInt(document.getElementById('r1Val').value) || 0;
        const r2 = parseInt(document.getElementById('r2Val').value) || 0;
        const r3 = parseInt(document.getElementById('r3Val').value) || 0;
        if (!name) return alert("请输入账户名");
        const idx = accounts.findIndex(a => a.name === name);
        if (idx > -1) {
            accounts[idx].r1 += r1; accounts[idx].r2 += r2; accounts[idx].r3 += r3;
            accounts[idx].type = type;
        } else {
            accounts.push({ name, type, r1, r2, r3, id: Date.now() });
        }
        saveAndRender();
        closeModal();
    }

    function saveAndRender() {
        localStorage.setItem('rs_final_v7', JSON.stringify(accounts));
        const tbody = document.getElementById('accountTable');
        tbody.innerHTML = '';
        let t1 = 0, t2 = 0, t3 = 0;
        accounts.forEach(acc => {
            t1 += acc.r1; t2 += acc.r2; t3 += acc.r3;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${acc.name}</strong><span class="acc-type">${acc.type}</span></td><td>${acc.r1}</td><td>${acc.r2}</td><td>${acc.r3}</td><td><span class="del-btn" onclick="deleteAcc(${acc.id})">删除</span></td>`;
            tbody.appendChild(tr);
        });
        document.getElementById('totalR1').innerText = t1;
        document.getElementById('totalR2').innerText = t2;
        document.getElementById('totalR3').innerText = t3;
    }

    function deleteAcc(id) { if(confirm("确定删除记录？")) { accounts = accounts.filter(a => a.id !== id); saveAndRender(); } }
    function clearAll() { if(confirm("确定清空数据？")) { accounts = []; saveAndRender(); } }

    // 导出 CSV (强制 UTF-8 BOM)
    function exportCSV() {
        if (accounts.length === 0) return alert("暂无数据");
        let csv = "\uFEFF账户名,类型,R1,R2,R3\n";
        accounts.forEach(a => { csv += `${a.name},${a.type},${a.r1},${a.r2},${a.r3}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "RS_Data.csv";
        link.click();
    }

    // 导入 CSV (增强解析)
    function importCSV(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const rows = text.split(/\r?\n/).slice(1);
            rows.forEach(row => {
                const cols = row.split(",");
                if (cols.length >= 5) {
                    const name = cols[0].replace(/^\uFEFF/, '').trim(); // 移除可能存在的BOM头
                    const type = cols[1].trim();
                    const r1 = parseInt(cols[2]) || 0;
                    const r2 = parseInt(cols[3]) || 0;
                    const r3 = parseInt(cols[4]) || 0;
                    if (name) {
                        const idx = accounts.findIndex(a => a.name === name);
                        if(idx > -1) {
                            accounts[idx].r1 += r1; accounts[idx].r2 += r2; accounts[idx].r3 += r3;
                        } else {
                            accounts.push({ name, type, r1, r2, r3, id: Date.now() + Math.random() });
                        }
                    }
                }
            });
            saveAndRender();
            alert("导入完成！");
        };
        reader.readAsText(file, "UTF-8"); // 明确指定读取编码
        event.target.value = '';
    }

    function generateReport() {
        if (accounts.length === 0) return alert("暂无数据");
        const sorted = [...accounts].sort((a,b) => (b.r1+b.r2+b.r3) - (a.r1+a.r2+a.r3));
        let report = `📊 Laporan Prestasi Terkini\n━━━━━━━━━━━━━━━━━━━━━━\n`;
        sorted.forEach((acc, i) => {
            report += `${i+1}. ${maskName(acc.name)}  R1: ${acc.r1} | R2: ${acc.r2} | R3: ${acc.r3}  Jumlah: ${acc.r1+acc.r2+acc.r3}\n`;
        });
        report += `━━━━━━━━━━━━━━━━━━━━━━\nSerahkan usaha kepada masa, serahkan hasil kepada ketekunan...✨\n\n💭 Anda sekarang, sedang berusaha untuk matlamat yang mana?`;
        navigator.clipboard.writeText(report).then(() => alert("战报已复制！"));
    }

    saveAndRender();
</script>
</body>
</html>
